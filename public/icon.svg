<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="flagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Map path glow -->
  <path d="M 100 380 Q 200 180, 280 280 T 410 150" fill="none" stroke="#60a5fa" stroke-width="24" stroke-linecap="round" opacity="0.4"/>
  <path d="M 100 380 Q 200 180, 280 280 T 410 150" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-dasharray="16 12"/>

  <!-- Pin 1 Start -->
  <circle cx="100" cy="380" r="28" fill="#10b981" stroke="#ffffff" stroke-width="6"/>

  <!-- Pin 2 POS -->
  <circle cx="280" cy="280" r="24" fill="#f59e0b" stroke="#ffffff" stroke-width="5"/>

  <!-- Finish Pin -->
  <g transform="translate(410, 150)">
    <path d="M 0 0 L 0 -80" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <path d="M 0 -80 Q 25 -65, 50 -80 Q 25 -95, 0 -80 Z" fill="url(#flagGrad)"/>
    <circle cx="0" cy="0" r="20" fill="#ef4444" stroke="#ffffff" stroke-width="5"/>
  </g>

  <!-- PGRI & Text Badge -->
  <rect x="80" y="410" width="352" height="56" rx="16" fill="#ffffff" opacity="0.95"/>
  <text x="256" y="446" font-family="system-ui, sans-serif" font-weight="800" font-size="28" fill="#1e293b" text-anchor="middle">PGRI PASIRWANGI</text>
</svg>
